[project]
name = "simple-agent-template"
version = "0.1.0"
description = "Minimal LangChain agent template for LangSmith/LangGraph deployment"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "chromadb>=1.5.8",
    "dotenv>=0.9.9",
    "fastmcp>=3.4.3",
    "httpx>=0.28.1",
    "ipython>=9.13.0",
    "langchain>=1.0.0",
    "langchain-anthropic>=1.0.0",
    "langchain-chroma>=1.1.0",
    "langchain-community>=0.4.1",
    "langchain-core>=1.2.28",
    "langchain-google-genai>=4.2.1",
    "langchain-google-vertexai>=3.2.2",
    "langchain-mcp-adapters>=0.3.0",
    "langchain-openai>=1.2.1",
    "langgraph>=1.0.0",
    "mcp>=1.28.1",
    "notebook>=7.5.5",
    "pandas>=3.0.2",
    "python-dotenv>=1.0.1",
]

[build-system]
requires = ["uv_build>=0.8.15,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "anyio>=4.7.0",
    "langgraph-cli[inmem]>=0.4.10",
    "pytest>=8.3.5",
    "ruff>=0.8.0",
]

[tool.uv.build-backend]
module-name = "agent"
source-include = ["langgraph.json", ".env.example", "Makefile", "tests/**"]
